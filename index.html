<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unfollow Insight — Instagram Followback Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find out who doesn't follow you back on Instagram. Upload your official data export and get an instant, private, in-browser analysis.">
  <meta name="color-scheme" content="light dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <script>
    // Apply the saved/system theme before first paint to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved ? saved === 'dark' : prefersDark) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">

  <style>
    body { transition: background-color 0.2s ease, color 0.2s ease; }

    .dropzone-active { border-color: #6366f1 !important; background-color: rgba(99, 102, 241, 0.08) !important; }

    /* DataTables controls */
    .dataTables_wrapper .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .dataTables_length select, .dataTables_filter input {
      border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 0.4rem 0.75rem; background: #fff; color: #0f172a;
    }
    .dt-buttons .dt-button {
      background: #4f46e5 !important; color: #fff !important; border: none !important;
      border-radius: 0.5rem !important; padding: 0.4rem 0.8rem !important;
      margin-right: 0.3rem !important; margin-bottom: 0.3rem !important; font-weight: 500; transition: background 0.15s ease;
    }
    .dt-buttons .dt-button:hover { background: #4338ca !important; }

    /* Dark theme (class="dark" on <html>) */
    html.dark .dataTables_length select, html.dark .dataTables_filter input {
      background: #1e293b; color: #f1f5f9; border-color: #334155;
    }
    html.dark .dataTables_wrapper .dataTables_info,
    html.dark .dataTables_wrapper .dataTables_paginate { color: #e2e8f0; }
    html.dark .dataTables_wrapper .dataTables_paginate .paginate_button { color: #e2e8f0 !important; border-color: transparent; }
    html.dark .dataTables_wrapper .dataTables_paginate .paginate_button.disabled { color: #64748b !important; }
    html.dark .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
      background: #1e293b !important; border-color: #1e293b !important; color: #fff !important;
    }
    html.dark .dataTables_wrapper .dataTables_paginate .paginate_button.current,
    html.dark .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {
      background: #4f46e5 !important; border-color: #4f46e5 !important; color: #fff !important;
    }
    html.dark table.dataTable { color: #e2e8f0; }
    html.dark table.dataTable thead th { color: #f1f5f9; border-bottom-color: #334155 !important; }
    html.dark table.dataTable tbody td { border-top-color: #1e293b !important; }
    html.dark table.dataTable.stripe tbody tr.odd, html.dark table.dataTable.display tbody tr.odd { background-color: #0f172a; }
    html.dark table.dataTable.stripe tbody tr.even, html.dark table.dataTable.display tbody tr.even { background-color: #111827; }
    html.dark table.dataTable tbody tr:hover { background-color: #1e293b !important; }
  </style>
</head>
<body class="font-sans bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 md:p-8 gap-6">

  <div class="w-full max-w-3xl">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm p-6 md:p-10">

      <!-- Header -->
      <div class="flex items-start justify-between gap-4 mb-8">
        <div>
          <div class="flex items-center gap-2 mb-1.5">
            <svg class="w-6 h-6 text-indigo-600 dark:text-indigo-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <path d="M8 12l3 3 5-6"/>
            </svg>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight">Unfollow Insight</h1>
          </div>
          <p class="text-sm text-slate-500 dark:text-slate-400">Find out who doesn't follow you back on Instagram.</p>
        </div>
        <button id="darkModeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"
          class="shrink-0 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <svg id="iconSun" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg id="iconMoon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>

      <!-- Error banner -->
      <div id="errorBanner" class="hidden mb-6 flex items-start gap-3 rounded-lg border border-red-200 dark:border-red-900/50 bg-red-50 dark:bg-red-950/40 p-4 text-sm text-red-700 dark:text-red-300">
        <svg class="w-5 h-5 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v5M12 16h.01"/>
        </svg>
        <p id="errorMessage" class="leading-relaxed"></p>
      </div>

      <!-- Upload -->
      <div class="grid sm:grid-cols-2 gap-4 mb-6">
        <label id="followersDropzone" class="flex flex-col items-center justify-center gap-1 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/40 px-4 py-6 text-center cursor-pointer transition-colors hover:border-indigo-400 dark:hover:border-indigo-500">
          <svg class="w-6 h-6 text-slate-400 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 18a4 4 0 01-1-7.87A5 5 0 0115.9 8H16a4 4 0 010 8H7z"/>
            <path d="M12 12v6M9.5 14.5L12 12l2.5 2.5"/>
          </svg>
          <span class="font-medium text-sm">Followers JSON</span>
          <span class="text-xs text-slate-400">Multiple files allowed</span>
          <span id="followersFileName" class="text-xs mt-1 font-medium text-indigo-600 dark:text-indigo-400"></span>
          <input type="file" id="followers" multiple accept=".json" class="sr-only">
        </label>

        <label id="followingDropzone" class="flex flex-col items-center justify-center gap-1 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/40 px-4 py-6 text-center cursor-pointer transition-colors hover:border-indigo-400 dark:hover:border-indigo-500">
          <svg class="w-6 h-6 text-slate-400 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 18a4 4 0 01-1-7.87A5 5 0 0115.9 8H16a4 4 0 010 8H7z"/>
            <path d="M12 12v6M9.5 14.5L12 12l2.5 2.5"/>
          </svg>
          <span class="font-medium text-sm">Following JSON</span>
          <span class="text-xs text-slate-400">Single file</span>
          <span id="followingFileName" class="text-xs mt-1 font-medium text-indigo-600 dark:text-indigo-400"></span>
          <input type="file" id="following" accept=".json" class="sr-only">
        </label>
      </div>

      <button id="analyzeBtn" type="button" onclick="processFiles()"
        class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed text-white py-3 rounded-xl font-semibold shadow-sm transition-colors mb-2">
        <svg id="btnIcon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        <svg id="btnSpinner" class="hidden w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <span id="btnText">Analyze Followback</span>
      </button>
      <p class="text-xs text-center text-slate-400 mb-6">Your data never leaves your browser — everything is processed locally.</p>

      <!-- Stats -->
      <div id="stats" class="grid grid-cols-3 gap-3 hidden mb-6">
        <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 p-4 text-center">
          <p class="text-2xl font-bold tabular-nums" id="statFollowing">0</p>
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400 mt-1">Following</p>
        </div>
        <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 p-4 text-center">
          <p class="text-2xl font-bold tabular-nums" id="statFollowers">0</p>
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400 mt-1">Followers</p>
        </div>
        <div class="rounded-xl border border-red-200 dark:border-red-900/50 bg-red-50 dark:bg-red-950/30 p-4 text-center">
          <p class="text-2xl font-bold tabular-nums text-red-600 dark:text-red-400" id="statNotBack">0</p>
          <p class="text-xs font-medium uppercase tracking-wide text-red-500/80 dark:text-red-400/80 mt-1">Not Following Back</p>
        </div>
      </div>

      <!-- Results -->
      <div id="results" class="hidden">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-3">Results</h2>
        <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800">
          <table id="notFollowTable" class="display nowrap w-full"></table>
        </div>
      </div>
    </div>

    <footer class="mt-6 text-center text-xs text-slate-400 dark:text-slate-500">
      Made with care by
      <a href="https://github.com/rizalfanex" target="_blank" rel="noopener" class="underline hover:text-indigo-500 dark:hover:text-indigo-400">rizalfanex</a>
      · MIT License ·
      <a href="https://github.com/rizalfanex/unfollow-insight" target="_blank" rel="noopener" class="underline hover:text-indigo-500 dark:hover:text-indigo-400">View on GitHub</a>
    </footer>
  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <script>
    // ---------- Theme ----------
    function syncThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('iconSun').classList.toggle('hidden', !isDark);
      document.getElementById('iconMoon').classList.toggle('hidden', isDark);
    }
    syncThemeIcons();

    document.getElementById('darkModeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      syncThemeIcons();
    });

    // ---------- Dropzones ----------
    function setupDropzone(inputId, labelId, nameId) {
      const input = document.getElementById(inputId);
      const label = document.getElementById(labelId);
      const nameEl = document.getElementById(nameId);

      function updateName() {
        if (!input.files.length) { nameEl.textContent = ''; return; }
        nameEl.textContent = input.files.length === 1
          ? input.files[0].name
          : `${input.files.length} files selected`;
      }

      input.addEventListener('change', updateName);

      ['dragover', 'dragenter'].forEach(evt => label.addEventListener(evt, e => {
        e.preventDefault();
        label.classList.add('dropzone-active');
      }));
      ['dragleave', 'dragend'].forEach(evt => label.addEventListener(evt, () => {
        label.classList.remove('dropzone-active');
      }));
      label.addEventListener('drop', e => {
        e.preventDefault();
        label.classList.remove('dropzone-active');
        if (e.dataTransfer && e.dataTransfer.files.length) {
          input.files = e.dataTransfer.files;
          updateName();
        }
      });
    }
    setupDropzone('followers', 'followersDropzone', 'followersFileName');
    setupDropzone('following', 'followingDropzone', 'followingFileName');

    // ---------- Error banner ----------
    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorBanner').classList.remove('hidden');
    }
    function clearError() {
      document.getElementById('errorBanner').classList.add('hidden');
    }

    // ---------- Loading state ----------
    function setLoading(isLoading) {
      const btn = document.getElementById('analyzeBtn');
      btn.disabled = isLoading;
      document.getElementById('btnText').textContent = isLoading ? 'Analyzing…' : 'Analyze Followback';
      document.getElementById('btnSpinner').classList.toggle('hidden', !isLoading);
      document.getElementById('btnIcon').classList.toggle('hidden', isLoading);
    }

    // ---------- File reading ----------
    async function readJSON(file) {
      let text;
      try {
        text = await file.text();
      } catch {
        throw new Error(`Could not read "${file.name}". Please try selecting the file again.`);
      }
      try {
        return JSON.parse(text);
      } catch {
        throw new Error(`"${file.name}" is not a valid JSON file.`);
      }
    }

    // ---------- Main ----------
    async function processFiles() {
      clearError();

      const followersFiles = document.getElementById('followers').files;
      const followingFile = document.getElementById('following').files[0];

      if (!followersFiles.length || !followingFile) {
        showError('Please select both your Followers and Following JSON files before analyzing.');
        return;
      }

      setLoading(true);
      // Yield one frame so the loading state actually paints before the parsing work starts.
      await new Promise(requestAnimationFrame);

      try {
        let followersSet = new Set();
        for (const file of followersFiles) {
          const data = await readJSON(file);
          if (!Array.isArray(data)) {
            throw new Error(`"${file.name}" doesn't look like an Instagram followers export (expected a JSON array). Make sure you selected the right file.`);
          }
          data.forEach(entry => {
            const value = entry?.string_list_data?.[0]?.value;
            if (value) followersSet.add(value);
          });
        }

        const followingData = await readJSON(followingFile);
        if (!Array.isArray(followingData?.relationships_following)) {
          throw new Error(`"${followingFile.name}" doesn't look like an Instagram following export (expected a "relationships_following" list). Make sure you selected the right file.`);
        }
        let followingSet = new Set();
        followingData.relationships_following.forEach(entry => {
          const username = entry.title || entry?.string_list_data?.[0]?.value;
          if (username) followingSet.add(username);
        });

        const notFollowBack = [...followingSet].filter(user => !followersSet.has(user));

        // Stats
        document.getElementById('statFollowing').textContent = followingSet.size;
        document.getElementById('statFollowers').textContent = followersSet.size;
        document.getElementById('statNotBack').textContent = notFollowBack.length;
        document.getElementById('stats').classList.remove('hidden');

        // Table
        document.getElementById('results').classList.remove('hidden');
        $('#notFollowTable').DataTable({
          destroy: true,
          data: notFollowBack.map((u, i) => [
            i + 1,
            '@' + u,
            `<a href="https://instagram.com/${encodeURIComponent(u)}" target="_blank" rel="noopener" class="text-indigo-600 dark:text-indigo-400 hover:underline">View profile ↗</a>`
          ]),
          columns: [
            { title: 'No' },
            { title: 'Username' },
            { title: 'Profile' }
          ],
          responsive: true,
          dom: '<"top"lBf>rt<"bottom"ip>',
          buttons: ['copy', 'csv', 'excel', 'pdf', 'print'],
          lengthMenu: [[10, 100, 500, -1], [10, 100, 500, 'All']],
          pageLength: 10
        });
      } catch (err) {
        showError(err.message || 'Something went wrong while analyzing your files. Please check that you uploaded the correct Instagram export files.');
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
